name: GalaxyLink
version: '${project.version}'
main: net.galaxysmp.link.GalaxyLink
api-version: '1.21'
description: Links Minecraft accounts to the GalaxySMP website.
softdepend: [floodgate]
commands:
  link:
    description: Link your Minecraft account to the GalaxySMP website.
    usage: /link <code>
    permission: galaxylink.use
permissions:
  galaxylink.use:
    description: Use /link
    default: true
