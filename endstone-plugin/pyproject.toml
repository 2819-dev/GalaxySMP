[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-galaxylink"
version = "2.9.0"
description = "Links Bedrock players to GalaxySMP website accounts (/link) voice chat, ranks and the economy (shop, auction house, NPCs)."
requires-python = ">=3.10"
dependencies = []

[project.entry-points."endstone"]
galaxylink = "endstone_galaxylink:GalaxyLink"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
endstone_galaxylink = ["*.json"]
