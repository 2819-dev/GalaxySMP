[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-galaxylink-partner"
version = "1.0.0"
description = "GalaxySMP Network plugin for partner servers: GalaxySMP ranks in chat and above heads, operator access for GalaxySMP's owner and admins, and the network logo pack."
requires-python = ">=3.10"
dependencies = []

[project.entry-points."endstone"]
galaxylink_partner = "endstone_galaxylink_partner:GalaxyNetwork"

[tool.setuptools.packages.find]
where = ["src"]
